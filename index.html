<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>認真人格測驗</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6eedc;color:#201c17;font:16px/1.65 system-ui,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:610px;margin:auto;padding:max(22px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid;padding-bottom:10px;font-weight:900}
section{padding:30px 0}h1,h2,p{margin:0 0 16px}
h1{font-size:clamp(55px,13vw,88px);line-height:1.08;letter-spacing:-.07em}
h2{font-size:clamp(20px,5.4vw,29px);line-height:1.45}
.kicker{font-weight:800;letter-spacing:.12em;margin:20px 0 10px;color:#882c1e}
.hero{margin:24px 0 30px;padding:20px 16px;background:#f4ae27;border:2px solid;box-shadow:5px 5px #201c17;transform:rotate(-1deg)}
.hero .kicker{margin-top:0}.hero p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #8b2a19;outline-offset:4px}
.choice,.primary{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px;text-align:left;border:2px solid #201c17;background:#fffbf1;border-radius:9px;margin:0 0 12px;box-shadow:3px 3px #201c17;transition:transform .08s}
.choice:active,.primary:active{transform:translate(2px,2px);box-shadow:1px 1px #201c17}
.choice[aria-pressed=true],.primary{background:#f4ae27}
.choice strong{background:#201c17;color:#fff;min-width:26px;text-align:center;border-radius:4px}
.primary{justify-content:center;font-weight:900}
.back{border:0;background:none;padding:10px 0;text-decoration:underline}
.nav{display:flex;align-items:center;gap:20px;margin-top:23px}
.progress{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-bottom:18px}
.progress i{height:6px;background:#ded2b9;border-radius:2px}.progress i.done{background:#a33d27}.progress i.current{background:#201c17}
.code{font:900 30px monospace;letter-spacing:.16em}
.result h1{font-size:clamp(45px,11vw,69px);margin:0}
.dims{display:grid;gap:9px;margin:0 0 24px}
.dimension{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border:1.5px solid #201c17;border-radius:8px;overflow:hidden;background:#fffbf1}
.dimension-name{text-align:center;font-size:14px;padding:0 7px;white-space:nowrap}
.endpoint{display:flex;align-items:center;gap:6px;padding:8px 7px;min-width:0;color:#675b4c;font-size:clamp(12px,3.5vw,15px);line-height:1.15}
.endpoint.right{flex-direction:row-reverse}
.endpoint b{display:grid;place-items:center;min-width:22px;height:24px;border-radius:4px;font:900 16px monospace;background:#e9dfcb;color:#201c17}
.endpoint.selected{background:#f4ae27;color:#201c17;font-weight:800}.endpoint.selected b{background:#201c17;color:#fff}
.description{background:#fffbf1;border:2px solid;padding:16px 18px;border-radius:9px;font-size:17px;line-height:1.8;margin-bottom:18px}
.type-toggle{border:1.5px solid #201c17;background:#f4ae27;font-weight:800;border-radius:6px;padding:7px 12px;font-size:14px;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.type-card{border:2px solid #201c17;border-radius:9px;background:#fff;padding:10px 8px;text-align:center;min-width:0}
.type-card h3{font-size:18px;margin:6px 0 2px}.type-card .type-code{font:800 16px monospace;letter-spacing:.12em}
.avatar svg{display:block;width:72%;margin:auto;image-rendering:pixelated;shape-rendering:crispEdges}
.result-avatar{max-width:235px;margin:0 auto 20px}
.gallery-heading{font-size:34px}.gallery-intro{font-size:14px;color:#675b4c}
@media(min-width:520px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.type-card h3{font-size:17px}}.wm-tag{display:block;text-align:right;margin-top:6px;font:800 11px/1 system-ui,sans-serif;letter-spacing:.14em;color:#882c1e;opacity:.75}
</style>
</head>
<body>
<main>
<header><span>認真人格測驗</span><button class="type-toggle" id="typeToggle" aria-expanded="false">人格類型</button></header>
<section id="app"></section>
</main>
<script>
// [題目, 選項A, 選項B, "A對應字母+B對應字母"]
// 第 1、5、9、13 題算「混蛋」，2、6、10、14 算「湊熱鬧」，3、7、11、15 算「出洋相」，4、8、12、16 算「較真」
const questions=[
["喜宴上，轉盤轉到你面前，只剩最後一隻龍蝦頭。你已經吃了兩隻，對面的阿伯一直沒動，但他剛剛默默把轉盤往回撥了一格。", "夾。轉盤停在我這裡，這是天意。", "轉回去給阿伯，順便幫他把殼剝好。", "JL"],
["你在診所候診，旁邊的阿姨講電話：「我跟你說，他根本不是親生的……不是啦，我是說那隻狗。」護士剛好叫到你的號碼。", "「不好意思，讓後面的人先。」然後坐回原位。", "起身進診間。人生不需要知道每隻狗的身世。", "HC"],
["你在捷運上打了一個超大的噴嚏，整節車廂的人都轉頭看你，有個小朋友開始鼓掌。", "起身向四周鞠躬，謝謝大家的支持。", "戴上口罩，假裝剛剛那個人已經下車了。", "FN"],
["你熬夜幫朋友搶到兩張演唱會票。到場才發現，你的位置正前方有一根大柱子，只看得到舞台最右邊的三分之一，還有一半的鼓手。", "拿著票根去找工作人員，指著柱子請他們給個說法，順便要求換位子。", "在柱子上貼一張偶像的照片，對著柱子應援一整晚。", "ER"],
["朋友要拍一支微電影，兩個角色任你挑。一個是在甜點店排了三小時，終於買到最後一份限量蛋糕的人；另一個是從後面衝出來，一把搶走蛋糕，邊跑邊回頭做鬼臉的人。", "我演排隊的。好人要有好報。", "我演搶蛋糕的。可以讓我邊跑邊把奶油抹在他臉上嗎？", "LJ"],
["電梯門快關上時，衝進來一個人，抱著一隻穿西裝的柯基，柯基脖子上還掛著員工證。電梯裡沒有人說話。", "偷瞄員工證，想知道牠是哪個部門的。", "盯著樓層數字，假裝這很正常。", "HC"],
["深夜失眠，你躺在床上，腳開始在空中踩腳踏車。踩著踩著，你覺得自己正在環島，已經騎到台東了。這時室友推門進來拿充電線。", "不停，跟他說：「我在池上，等一下要去買便當。」然後繼續踩。", "立刻停下來，抱著小腿假裝抽筋。", "FN"],
["你發現家裡客廳那幅「馬到成功」掛了十年，其實一直掛反，馬這十年都在往回跑。", "馬上拿下來重掛，順便檢討這十年的運勢。", "讓牠繼續跑吧。跑了十年，也跑出感情了。", "ER"],
["公司下午茶訂了雞排，剛好一人一份。你發現其中一份特別大，大概是別人的一點五倍。", "拿最小的，大的留給今天加班最晚的人。", "拿大的。先到先得，這是職場倫理。", "LJ"],
["你在公園長椅上吃三明治，旁邊兩隻鴿子為了一塊麵包打起來，路人開始圍過來拍影片。", "也拿出手機，順便幫鴿子配上體育主播的旁白。", "換一張長椅。我的三明治比較重要。", "HC"],
["朋友的婚禮需要一個人在新人進場時扮成邱比特：白色尿布造型、背翅膀、沿路撒花瓣。", "我負責在台下拍照。", "我來。請問可以吊鋼絲從天而降嗎？", "NF"],
["你收到一封信，寄件人是十年後的你。信裡只寫了一句：「記得不要買那顆西瓜。」沒有日期，也沒說是哪一顆。", "從今天起，每顆看過的西瓜都記下產地、重量、日期，一顆一顆排查。", "管他的，今晚就去買一顆來吃。未來的我自己會處理。", "ER"],
["你跟朋友比賽誰先吃完一碗麻辣鍋，輸的請客。你偷看到店員拿錯了，他那鍋比你的辣三倍。他還沒發現，正在吹第一口。", "不說。比賽就是比賽，運氣也是實力。", "舉手喊暫停，跟他換鍋。", "JL"],
["健身房更衣室裡，隔壁兩個人小聲說：「他昨天在跑步機上跑錯方向，跑了二十分鐘才發現。」你剛換好衣服。", "坐下來慢慢綁鞋帶。我想知道是誰。", "直接去運動。別人往哪個方向跑，不關我的事。", "HC"],
["視訊會議上，你以為鏡頭關了，正敷著面膜、頭上夾三個髮捲，跟著音樂扭腰。主管突然說：「欸，你那邊好像有開鏡頭喔。」二十個人都在看。", "不關鏡頭，跳完這一段，然後說：「好，我們繼續。」", "秒關鏡頭、退出會議，再假裝網路斷線重新加入。", "FN"],
["二姑把你小時候光屁股的照片當成「早安圖」發到家族群組，下面已經有十二個讚。", "回一個大笑貼圖。算了，都十二個讚了。", "私訊二姑請她收回，並請她交代照片是從哪裡來的。", "RE"]
];
const prefix='認真';
const types={JHFE:'攪局',JHFR:'起鬨',JHNE:'監工',JHNR:'吃瓜',JCFE:'獨唱',JCFR:'放飛',JCNE:'算盤',JCNR:'躺平',LHFE:'班長',LHFR:'暖場',LHNE:'偵探',LHNR:'捧場',LCFE:'藝術',LCFR:'搞怪',LCNE:'校對',LCNR:'佛系'};
const descriptions={
JHFE:"哪裡有動靜，你就往哪裡去；到了現場，又覺得光看不夠，得親自下場。你會在別人吵架時糾正他們用錯的成語，在婚禮上搶過麥克風補充新郎漏講的細節。散場後大家還在討論的那一段，通常都跟你有關。",
JHFR:"你是「親一個！親一個！」的第一個聲音。氣氛不夠熱，你負責加柴；有人要上台，你負責推。等他真的站上去了，你已經在台下笑到拍桌。至於他講得好不好，你其實不太在意，有趣就好。",
JHNE:"你不一定會下場，但一定站在最好的位置。別人搬沙發，你在旁邊說「左邊再高一點」；別人吵架，你在心裡默默記下誰先講錯話。事後如果有人問經過，你可以從第一句開始重播。",
JHNR:"你是天生的觀眾，自帶座位，自備零食。八卦傳到你這裡已經是第三手，你卻聽得比當事人還投入。你不評論、不站隊、不轉傳，只是每隔幾天會問一句：「後來呢？」",
JCFE:"別人的熱鬧你沒興趣，你只想辦自己的。你會在沒人要求的情況下準備一段完整的生日致詞，講到一半發現唸錯字，堅持從頭再來一遍。台下有沒有人在聽不重要，重點是流程要對。",
JCFR:"外面發生什麼事你不太關心，因為你自己就夠好玩了。你會一個人在客廳跳舞、對著鏡子練習得獎感言、穿睡衣下樓倒垃圾還順便跟鄰居聊十分鐘。被看到也沒關係，反正你今天心情很好。",
JCNE:"你很安靜，但你什麼都記得。誰上次欠你一杯飲料、哪家店的點數下個月到期、團購時誰少付了五塊，你心裡都有一本帳。你不會當場說，但下次分帳時，你會把計算機推到桌子中間。",
JCNR:"能拿的你會拿，能躲的你會躲。最後一塊肉你夾了，大掃除那天你剛好有事。你不惹事，也不太在意輸贏，只希望這世界大部分的事情，都能在你不用起身的情況下解決。",
LHFE:"你樂於助人，也不介意大家看見你在助人。活動需要有人帶，你第一個舉手；名單排錯一格，你連夜重做。大家玩得開心你就滿足了，不過要是有人拿錯號碼牌，你還是會走過去提醒他。",
LHFR:"冷場對你來說是一種生理上的不舒服。只要大家安靜超過三秒，你就會開始講自己最近做過的蠢事。你不介意當那個被笑的人，因為只要大家笑了，你就覺得今天的任務完成了。",
LHNE:"你對真相有一種執著，但你很有禮貌。聽到不合理的說法，你不會當面拆穿，而是默默去查。三天後，你會用「我剛好看到一篇文章」開頭，把來源、截圖和時間軸整理好，傳到群組裡。",
LHNR:"你是每個人都想要的那種朋友。誰講笑話你都笑，誰發限動你都按愛心，誰開店你都第一個去。你自己不太出風頭，但每個熱鬧的場合裡，最用力鼓掌的那個人一定是你。",
LCFE:"你很溫和，但有自己的堅持。你願意把最好的位子讓給別人，卻絕不讓步拍照的構圖。你常常自己找樂子，做一些別人看不懂的事；被問起時你會很認真地解釋，只是對方通常聽完更不懂了。",
LCFR:"你不搶也不爭，卻常常讓人摸不著頭緒。大家正經開會時，你在筆記本上畫了一隻正在開會的雞。你不愛湊熱鬧，熱鬧卻常常自己找上門，因為你總是做了奇怪的事，還一臉無辜的那個人。",
LCNE:"你很少說話，一開口通常是「這裡好像有個錯字」。你讓座、讓位、讓最後一口，卻沒辦法讓一個錯誤繼續存在。大家都覺得你很好相處，只有你知道自己腦中正在默默修改每一張菜單。",
LCNR:"大部分的事你都說「都可以」，而且是真心的。餐廳客滿就換一家，火車誤點就多看一章書。別人覺得你脾氣好，其實你只是很早就發現，大多數的事等一下就過去了。"
};
const dims=['混蛋','湊熱鬧','出洋相','較真'];
const ends=[[['J','jerk'],['L','lady']],[['H','hot'],['C','cold']],[['F','foreign'],['N','native']],[['E','care'],['R','car']]];
function dimensionBar(name,i,code){
 const endpoint=([letter,word],side)=>{const sel=letter===code[i];return '<span class="endpoint '+side+(sel?' selected':'')+'"><b>'+letter+'</b><span>'+word+'</span>'+(sel?'<span aria-hidden="true">✓</span>':'')+'</span>'};
 return '<div class="dimension" role="group" aria-label="'+name+'，結果 '+code[i]+'">'+endpoint(ends[i][0],'left')+'<strong class="dimension-name">'+name+'</strong>'+endpoint(ends[i][1],'right')+'</div>';
}
// 每個維度 4 題，至少 3 票才算多數；2:2 平手時以該維度第一題為準
function score(ans){return dims.map((_,d)=>{const votes=[0,4,8,12].map(i=>questions[i+d][3][ans[i+d]]);return votes.find(v=>votes.filter(x=>x===v).length>2)??votes[0]}).join('')}

// 原創像素小人：每個維度決定一個外觀特徵
// J/L 表情（壞笑／害羞）、H/C 道具（爆米花／耳機）、F/N 服裝（亮色閃亮／連帽衫）、E/R 髮型（整齊＋眼鏡／亂髮）
function avatar(code){
 const [a,b,c,d]=code, K='#201c17', SKIN='#f2c9a0', HAIR='#4a3222';
 let r=[];const px=(x,y,w,h,f)=>r.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>');
 const shirt=c==='F'?'#f4ae27':'#6b8aa3';
 if(c==='N'){px(3,1,10,1,K);px(2,2,1,1,K);px(13,2,1,1,K);px(1,3,1,9,K);px(14,3,1,9,K);px(3,2,10,1,shirt);px(2,3,12,10,shirt)} // 帽兜
 // 身體
 px(3,12,10,7,K);px(4,13,8,5,shirt);
 if(c==='F'){px(7,13,2,1,'#a33d27');px(6,13,1,1,'#a33d27');px(9,13,1,1,'#a33d27');px(5,15,1,1,'#fffbf1');px(10,16,1,1,'#fffbf1')}
 else{px(7,13,1,3,'#fffbf1');px(8,13,1,3,'#fffbf1');px(5,16,6,1,'#56748b')}
 px(3,17,1,1,SKIN);px(12,17,1,1,SKIN);
 // 腿
 const leg=a==='J'?'#a33d27':'#3b5b7a';px(5,19,2,1,leg);px(9,19,2,1,leg);px(4,19,1,1,K);px(11,19,1,1,K);
 // 頭
 px(4,3,8,1,K);px(4,12,8,1,K);px(3,4,1,8,K);px(12,4,1,8,K);px(4,4,8,8,SKIN);
 // 頭髮
 px(4,4,8,2,HAIR);
 if(d==='E'){px(4,6,1,2,HAIR);px(11,6,1,1,HAIR);px(7,4,1,1,'#2e1f15')}
 else{px(5,2,1,1,HAIR);px(7,1,1,2,HAIR);px(9,2,1,1,HAIR);px(11,2,1,1,HAIR);px(4,6,1,1,HAIR);px(10,6,2,1,HAIR);px(12,4,1,1,HAIR)}
 // 眼鏡
 if(d==='E'){px(4,6,3,1,K);px(9,6,3,1,K);px(7,7,2,1,K);px(4,7,3,2,'#cfe3ef');px(9,7,3,2,'#cfe3ef')}
 // 眼睛
 if(a==='J'){px(5,7,2,1,K);px(9,7,2,1,K);px(5,6,1,1,K);px(10,6,1,1,K)}
 else{px(6,7,1,2,K);px(9,7,1,2,K);px(4,9,2,1,'#f08a7a');px(10,9,2,1,'#f08a7a')}
 // 嘴巴
 if(a==='J'){px(6,10,3,1,K);px(9,9,1,1,K)}else{px(6,9,1,1,K);px(9,9,1,1,K);px(7,10,2,1,K)}
 // 道具
 if(b==='H'){px(12,13,4,1,'#fff3c4');px(12,14,4,4,'#fffbf1');px(13,14,1,4,'#c0392b');px(15,14,1,4,'#c0392b');px(12,12,1,1,'#fff3c4');px(14,12,1,1,'#fff3c4')}
 else{px(4,2,8,1,'#333');px(3,3,1,1,'#333');px(12,3,1,1,'#333');px(2,6,2,4,'#a33d27');px(12,6,2,4,'#a33d27')}
 // 閃亮
 if(c==='F'){px(1,3,1,1,'#f4ae27');px(0,4,3,1,'#f4ae27');px(1,5,1,1,'#f4ae27');px(14,9,1,1,'#f4ae27');px(1,14,1,1,'#f4ae27')}
 return '<div class="avatar"><svg viewBox="0 0 16 20" role="img" aria-label="'+prefix+types[code]+'像素小人">'+r.join('')+'</svg></div>';
}
const order=['JHNR','JHNE','JCFR','JHFE','JCNR','JCNE','JCFE','JHFR','LHNR','LHFE','LHFR','LHNE','LCNR','LCNE','LCFR','LCFE'];
let page=-1,answers=Array(16).fill(null),galleryOpen=false;
const app=document.getElementById('app'),toggle=document.getElementById('typeToggle');
function render(focus=true){
 toggle.textContent=galleryOpen?'返回測試':'人格類型';toggle.setAttribute('aria-expanded',String(galleryOpen));
 if(galleryOpen){app.innerHTML='<h2 class="gallery-heading" tabindex="-1">人格類型</h2><p class="gallery-intro">16 種認真人格，你身邊都有誰？</p><div class="gallery">'+order.map(code=>'<article class="type-card">'+avatar(code)+'<h3>'+prefix+types[code]+'</h3><div class="type-code">'+code+'</div></article>').join('')+'</div><button class="back" data-act="close-gallery">← 返回測試</button>'}
 else if(page<0){app.innerHTML='<div class="hero"><div class="kicker">16 道題 / 16 種人</div><h1>認真人格</h1><p>喜宴轉盤上只剩最後一隻龍蝦頭。<br>你夾不夾？</p></div><p>選你實際上比較可能做的那個。兩種都做過的話，就想想最近一次你是怎麼做的。</p><button class="primary" data-act="next">開始測驗 →</button>'}
 else if(page===16){const code=score(answers);app.innerHTML='<div class="hero result"><div class="kicker">你測出來是</div><div class="code">'+code+'</div><h1 tabindex="-1">'+prefix+types[code]+'</h1></div><div class="result-avatar">'+avatar(code)+'</div><p class="description">'+descriptions[code]+'</p><div class="dims">'+dims.map((n,i)=>dimensionBar(n,i,code)).join('')+'</div><button class="primary" data-act="restart">重新測驗</button><button class="back" data-act="back">← 回到第 16 題</button>'}
 else{const [q,a,b]=questions[page];app.innerHTML='<div class="progress" aria-hidden="true">'+answers.map((v,i)=>'<i class="'+(i===page?'current':v!==null?'done':'')+'"></i>').join('')+'</div><p class="kicker">第 '+String(page+1).padStart(2,'0')+' / 16 題</p><h2 tabindex="-1">'+q+'</h2>'+[a,b].map((x,i)=>'<button class="choice" data-answer="'+i+'" aria-pressed="'+(answers[page]===i)+'"><strong>'+'AB'[i]+'</strong><span>'+x+'</span></button>').join('')+'<div class="nav"><button class="back" data-act="back">'+(page===0?'← 封面':'← 上一題')+'</button></div>'}
 if(focus){window.scrollTo(0,0);app.querySelector('[tabindex="-1"]')?.focus({preventScroll:true})}
}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.act==='close-gallery'){galleryOpen=false;render();return}
 if(b.dataset.answer!==undefined){answers[page]=Number(b.dataset.answer);page++;render();return}
 if(b.dataset.act==='restart'){answers=Array(16).fill(null);page=-1}else if(b.dataset.act==='next')page++;else if(b.dataset.act==='back')page--;render()});
toggle.addEventListener('click',()=>{galleryOpen=!galleryOpen;render()});
// 浮水印文字：改這一行就好
const WATERMARK='@alyssa';
(function(){const tag=document.createElement('div');tag.className='wm-tag';tag.textContent=WATERMARK;document.querySelector('header').after(tag)})();
render(false);
</script>
</body>
</html>
